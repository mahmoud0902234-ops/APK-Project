name: بناء APK تلقائياً
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: android-actions/setup-android@v3

      - name: كتابة إعدادات المشروع
        run: |
          mkdir -p www
          cat > package.json << 'EOF'
          {"name":"interiorx","version":"1.0.0"}
          EOF
          cat > capacitor.config.json << 'EOF'
          {"appId":"com.interiorx.app","appName":"InteriorX","webDir":"www"}
          EOF

      - name: تثبيت Capacitor
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: تجهيز مشروع أندرويد
        run: |
          npx cap add android
          npx cap sync android

      - name: بناء الـ APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: تجهيز APK للتحميل
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/InteriorX.apk

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: InteriorX-APK
          path: output/InteriorX.apk
